name: CI
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync
      - run: uv sync
      - run: uv run ruff check src tests
      - run: uv run mypy src/kg --python-version ${{ matrix.python }}
      - run: uv run pytest tests/viz -v
      - run: uv run python -c "import glob,zipfile; z=zipfile.ZipFile(glob.glob('dist/*.whl')[0]); names=z.namelist(); assert any('assets/LICENSE.upstream' in n for n in names); assert any('assets/PROVENANCE.md' in n for n in names); assert all('http://' not in z.read(n).decode(errors='replace') for n in names if n.endswith('.js') and 'viz/assets/assets' in n)"
