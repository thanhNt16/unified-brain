name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    name: Build and publish release
    needs: [ci]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: uv sync --group dev
      - run: uv build
      - run: uv run kg --version
      - name: Verify version and create checksums
        shell: bash
        run: |
          test "$(uv run kg --version)" = "kg 1.0.0"
          wheel=$(find dist -maxdepth 1 -name '*.whl' -print -quit)
          test -n "$wheel"
          cp "$wheel" dist/artifact.whl
          (
            cd dist
            shasum -a 256 artifact.whl > SHA256SUMS
            shasum -a 256 -c SHA256SUMS
          )
      - name: Publish artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(uv run kg --version | awk '{print $2}')"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" dist/* --title "$tag" --notes "Auto release from commit ${GITHUB_SHA::7}" --target main
          fi
