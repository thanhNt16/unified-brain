[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "unified-brain-kg"
version = "1.0.0"
description = "Offline local-first knowledge graph toolkit"
requires-python = ">=3.11"
dependencies = ["click>=8.1,<9", "pydantic>=2.7,<3", "PyYAML>=6,<7"]

[dependency-groups]
dev = ["pytest>=8,<9", "ruff>=0.8,<1", "mypy>=1.13,<2"]

[project.scripts]
kg = "kg.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/kg"]
artifacts = [
    "src/kg/viz/assets/index.html",
    "src/kg/viz/assets/LICENSE.upstream",
    "src/kg/viz/assets/PROVENANCE.md",
    "src/kg/viz/assets/THIRD_PARTY.upstream.md",
    "src/kg/viz/assets/assets/*",
]

[tool.hatch.build.targets.sdist]
include = ["src/kg", "templates"]
artifacts = [
    "src/kg/viz/assets/index.html",
    "src/kg/viz/assets/LICENSE.upstream",
    "src/kg/viz/assets/PROVENANCE.md",
    "src/kg/viz/assets/THIRD_PARTY.upstream.md",
    "src/kg/viz/assets/assets/*",
]

[tool.hatch.build.targets.wheel.force-include]
"templates/skills" = "templates/skills"
"src/kg/viz/assets/LICENSE.upstream" = "src/kg/viz/assets/LICENSE.upstream"
"src/kg/viz/assets/PROVENANCE.md" = "src/kg/viz/assets/PROVENANCE.md"
"src/kg/viz/assets/THIRD_PARTY.upstream.md" = "src/kg/viz/assets/THIRD_PARTY.upstream.md"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
